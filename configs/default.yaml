# Default configuration for RoFormer LLM training

model:
  vocab_size: 5000
  embed_dim: 512
  num_heads: 8
  num_layers: 8
  ff_dim: 2048
  max_position_embeddings: 512
  dropout: 0.1
  pad_token_id: 0
  use_yarn: true  # Enable YaRN scaling for better extrapolation
  yarn_alpha: 1.0  # YaRN alpha parameter
  yarn_beta: 0.1  # YaRN beta parameter
  use_lape: false  # LAPE not novel (DAPE exists)
  lape_lite: false

training:
  batch_size: 16
  num_epochs: 50
  learning_rate: 3e-5
  weight_decay: 0.01
  warmup_steps: 1000
  max_grad_norm: 1.0
  gradient_accumulation_steps: 1
  fp16: false  # Enable for faster training on CUDA
  bf16: false  # Enable for faster training on newer GPUs

data:
  data_path: "data/processed/training_chunks.txt"
  max_length: 256
  train_split: 0.9
  val_split: 0.05
  test_split: 0.05
  shuffle: true
  num_workers: 4

tokenizer:
  vocab_size: 5000
  special_tokens:
    pad: "<pad>"
    unk: "<unk>"
    bos: "<bos>"
    eos: "<eos>"

logging:
  log_interval: 10
  eval_interval: 500
  save_interval: 1000
  log_dir: "logs"
  checkpoint_dir: "checkpoints"
  tensorboard: true
  wandb: false

hardware:
  device: "auto"  # auto, cuda, mps, cpu
  distributed: false
  num_gpus: 1

optimizer:
  type: "adamw"
  betas: [0.9, 0.999]
  eps: 1e-8

scheduler:
  type: "cosine_restarts"  # cosine, cosine_restarts, linear, constant
  warmup_ratio: 0.1
  min_lr: 1e-6

evaluation:
  metrics:
    - perplexity
    - generation_quality
    - coherence
  generation:
    max_new_tokens: 50
    temperature: 0.8
    top_k: 50
    num_samples: 5
